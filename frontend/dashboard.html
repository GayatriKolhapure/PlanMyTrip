<body>

    <aside class="sidebar">

        <div class="sidebar-logo">
            PlanMyTrip
        </div>

        <a class="nav-item active" href="#">
            🗺️ My Trips
        </a>

        <div class="sidebar-spacer"></div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </aside>

    <main class="main">

        <div class="top-bar">

            <div class="page-title">
                My <span>Trips</span>
            </div>

            <button class="btn-new" onclick="openModal()">
                + New Trip
            </button>

        </div>

        <div class="stats-row">

            <div class="stat-card">
                <div>Total Trips</div>
                <div class="stat-value" id="totalTrips">0</div>
            </div>

            <div class="stat-card">
                <div>Upcoming</div>
                <div class="stat-value" id="upcomingTrips">0</div>
            </div>

            <div class="stat-card">
                <div>Total Budget</div>
                <div class="stat-value" id="totalBudget">₹0</div>
            </div>

            <div class="stat-card">
                <div>Completed</div>
                <div class="stat-value" id="completedTrips">0</div>
            </div>

        </div>

        <div class="trips-grid" id="tripsGrid">
        </div>

    </main>

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <h2 style="margin-bottom:1rem;">
                Create Trip
            </h2>

            <div class="modal-group">
                <label class="modal-label">Destination</label>
                <input class="modal-input" id="m_destination" type="text" />
            </div>

            <div class="modal-group">
                <label class="modal-label">Start Date</label>
                <input class="modal-input" id="m_startDate" type="date" />
            </div>

            <div class="modal-group">
                <label class="modal-label">End Date</label>
                <input class="modal-input" id="m_endDate" type="date" />
            </div>

            <div class="modal-group">
                <label class="modal-label">Budget</label>
                <input class="modal-input" id="m_budget" type="number" />
            </div>

            <div class="modal-group">
                <label class="modal-label">Type</label>

                <select class="modal-input" id="m_style">
                    <option value="BEACH">Beach</option>
                    <option value="ADVENTURE">Adventure</option>
                    <option value="CITY">City</option>
                    <option value="HILL">Hill</option>
                </select>
            </div>

            <div class="modal-actions">

                <button class="btn-cancel" onclick="closeModal()">
                    Cancel
                </button>

                <button class="btn-save" onclick="saveTrip()">
                    Save Trip
                </button>

            </div>

        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>

        const API_BASE = 'http://localhost:8081';

        let allTrips = [];

        const token = localStorage.getItem("pmt_token");

        if (!token) {

            window.location.href = "login.html";
        }

        async function loadTrips() {

            try {

                const response = await fetch(
                    `${API_BASE}/api/trips`
                );

                const data = await response.json();

                allTrips = data;

                renderTrips(data);

                updateStats(data);

            }
            catch (error) {

                showToast('Failed to load trips', 'error');
            }
        }

        function renderTrips(trips) {

            const grid = document.getElementById('tripsGrid');

            if (trips.length === 0) {

                grid.innerHTML = '<h3>No Trips Found</h3>';

                return;
            }

            grid.innerHTML = trips.map((trip, index) => `

        <div class="trip-card">

            <div class="trip-card-top trip-dest-bg-${(index % 4) + 1}">
                ✈️ ${trip.tripName || 'Trip'}
            </div>

            <div class="trip-card-body">

                <div class="trip-meta">
                    📅 ${trip.startDate || ''}<br>
                    🏁 ${trip.endDate || ''}
                </div>

                <div class="budget-row">
                    <span>Budget</span>
                    <strong>₹${trip.totalBudget || 0}</strong>
                </div>

                <div class="trip-actions">

                    <button
                        class="trip-btn danger"
                        onclick="deleteTrip(${trip.tripId})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>

    `).join('');
        }

        function updateStats(trips) {

            document.getElementById('totalTrips').textContent = trips.length;

            document.getElementById('upcomingTrips').textContent = trips.length;

            document.getElementById('completedTrips').textContent = 0;

            let total = 0;

            trips.forEach(t => {
                total += t.totalBudget || 0;
            });

            document.getElementById('totalBudget').textContent = `₹${total}`;
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        async function saveTrip() {

            const destination = document.getElementById('m_destination').value;
            const style = document.getElementById('m_style').value;

            const body = {
                userId: 1,
                location: destination,
                days: 5,
                type: style
            };

            try {

                const response = await fetch(
                    `${API_BASE}/api/trips/plan`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    }
                );

                if (response.ok) {

                    closeModal();

                    showToast('Trip Created', 'success');

                    loadTrips();
                }
            }
            catch (error) {

                showToast('Trip Creation Failed', 'error');
            }
        }

        async function deleteTrip(id) {

            try {

                await fetch(
                    `${API_BASE}/api/trips/${id}`,
                    {
                        method: 'DELETE'
                    }
                );

                showToast('Trip Deleted', 'success');

                loadTrips();
            }
            catch (error) {

                showToast('Delete Failed', 'error');
            }
        }

        function logout() {

            localStorage.removeItem('pmt_token');

            localStorage.removeItem('pmt_user');

            window.location.href = 'login.html';
        }

        function showToast(msg, type) {

            const toast = document.getElementById('toast');

            toast.innerText = msg;

            toast.className = `toast show ${type}`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        loadTrips();

    </script>

</body>

</html>
