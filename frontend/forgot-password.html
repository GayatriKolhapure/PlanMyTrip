<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .box {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Forgot Password</h2>

        <input type="email" id="email" placeholder="Enter Email">

        <button onclick="sendQuestion()">
            Verify Email
        </button>

        <div id="questionBox" style="display:none;">

            <h4 style="margin-top:20px;" id="question"></h4>

            <input type="text" id="answer" placeholder="Security Answer">

            <button onclick="verifyAnswer()">
                Verify Answer
            </button>

        </div>

        <div id="resetBox" style="display:none;">

            <input type="password" id="newPassword" placeholder="New Password">

            <button onclick="resetPassword()">
                Reset Password
            </button>

        </div>

    </div>

    <script>

        const API_BASE = "http://localhost:8081";

        let currentEmail = "";

        async function sendQuestion() {

            currentEmail =
                document.getElementById("email").value;

            try {

                const response = await fetch(
                    `${API_BASE}/api/users/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: currentEmail
                        })
                    }
                );

                const result = await response.json();



                if (response.ok) {

                    document
                        .getElementById("questionBox")
                        .style.display = "block";

                    document
                        .getElementById("question")
                        .innerText = result.data;


                }
                else {

                    alert(question);
                }

            }
            catch (error) {

                console.log(error);

                alert("Server Error");
            }
        }

        async function verifyAnswer() {

            const answer =
                document.getElementById("answer").value;

            try {

                const response = await fetch(
                    `${API_BASE}/api/users/verify-answer`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: currentEmail,
                            answer: answer
                        })
                    }
                );

                const data = await response.text();

                if (response.ok) {

                    document
                        .getElementById("resetBox")
                        .style.display = "block";

                    alert("Answer Verified");
                }
                else {

                    alert(data);
                }

            }
            catch (error) {

                alert("Server Error");
            }
        }


        async function resetPassword() {

            const newPassword =
                document.getElementById("newPassword").value;

            try {

                const response = await fetch(
                    "http://localhost:8081/api/users/reset-password",
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: currentEmail,
                            newPassword: newPassword
                        })
                    }
                );

                const result = await response.json();

                if (response.ok) {

                    alert("Password Reset Successful");

                    window.location.href = "login.html";
                }
                else {

                    alert(result.message);
                }

            }
            catch (error) {

                console.log(error);

                alert("Server Error");
            }
        }



    </script>

</body>

</html>
