<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurants</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
  
        body {
            background: #0b1220;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            padding: 20px 60px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        h1 {
            margin-top: 40px;
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            justify-content: center;
        }

        .filters input,
        .filters button {
            margin-top: 25px;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .filters input {
            width: 220px;
        }

        .filters button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .filters button:hover {
            background: #1d4ed8;
        }

        .restaurant-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .restaurant-card {
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
        }

        .restaurant-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .restaurant-content {
            padding: 20px;
        }

        .restaurant-content h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .restaurant-content p {
            margin-bottom: 8px;
            color: #d1d5db;
            line-height: 1.5;
        }

        .rating {
            color: gold;
            font-weight: bold;
        }

        .cost {
            color: #10b981;
            font-weight: bold;
            font-size: 18px;
        }

        .tags {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: #374151;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .reserve-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .reserve-btn:hover {
            background: #1d4ed8;
        }

        .empty-message {
            text-align: center;
            font-size: 24px;
            margin-top: 40px;
            color: #d1d5db;
        }
    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            PlanMyTrip
        </div>

        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./dashboard.html">Dashboard</a>
            <a href="./hotels.html">Hotels</a>
            <a href="./destinations.html">Destinations</a>
        </div>

    </div>

    <h1>Restaurants & Cafes</h1>

    <div class="filters">

        <input type="text"
               id="locationFilter"
               placeholder="Search location">

        <button onclick="applyFilters()">
            Search
        </button>

        <button onclick="loadRestaurants()">
            Reset
        </button>

    </div>

    <div class="restaurant-container"
         id="restaurantContainer">
    </div>

    <script>

        const API_BASE = "http://localhost:8081";

        const token = localStorage.getItem("pmt_token");

        // ✅ check login
        if (!token) {

            alert("Please login first");

            window.location.href = "./login.html";
        }

        // ✅ load restaurants
        async function loadRestaurants() {

            try {

                const response = await fetch(
                    `${API_BASE}/api/restaurants`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        }
                    }
                );

                // ✅ session expired
                if (response.status === 401 ||
                    response.status === 403) {

                    alert("Session expired. Please login again.");

                    localStorage.removeItem("pmt_token");

                    window.location.href = "./login.html";

                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to fetch restaurants");
                }

                const restaurants = await response.json();

                displayRestaurants(restaurants);

            }
            catch (error) {

                console.log(error);

                document.getElementById(
                    "restaurantContainer"
                ).innerHTML = `
                    <div class="empty-message">
                        Failed to load restaurants
                    </div>
                `;
            }
        }

        // ✅ display restaurants
        function displayRestaurants(restaurants) {

            const container =
                document.getElementById(
                    "restaurantContainer"
                );

            container.innerHTML = "";

            if (restaurants.length === 0) {

                container.innerHTML = `
                    <div class="empty-message">
                        No Restaurants Found
                    </div>
                `;

                return;
            }

            restaurants.forEach(r => {

                container.innerHTML += `

                <div class="restaurant-card">

                    <img src="${r.imageUrl || 'https://via.placeholder.com/400x220'}"
                         alt="restaurant">

                    <div class="restaurant-content">

                        <h2>${r.name}</h2>

                        <p>${r.description || ''}</p>

                        <p>
                            <strong>Location:</strong>
                            ${r.location}
                        </p>

                        <p>
                            <strong>Cuisine:</strong>
                            ${r.cuisine || 'N/A'}
                        </p>

                        <p>
                            <strong>Type:</strong>
                            ${r.type || 'N/A'}
                        </p>

                        <p class="cost">
                            ₹${r.averageCostPerPerson || 0}
                            per person
                        </p>

                        <p class="rating">
                            ⭐ ${r.rating || 0}
                        </p>

                        <div class="tags">

                            ${r.hasWifi
                                ? '<span class="tag">WiFi</span>'
                                : ''}

                            ${r.hasParking
                                ? '<span class="tag">Parking</span>'
                                : ''}

                            ${r.vegOnly
                                ? '<span class="tag">Veg Only</span>'
                                : ''}

                        </div>

                        <button class="reserve-btn"
                                onclick="reserveRestaurant(${r.id})">

                            Reserve Table

                        </button>

                    </div>

                </div>

                `;
            });
        }

        // ✅ filter by location
        async function applyFilters() {

            const location =
                document.getElementById(
                    "locationFilter"
                ).value.trim();

            // empty search
            if (location === "") {

                loadRestaurants();

                return;
            }

            try {

                const response = await fetch(
                    `${API_BASE}/api/restaurants/location/${location}`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error();
                }

                const restaurants = await response.json();

                displayRestaurants(restaurants);

            }
            catch (error) {

                console.log(error);

                alert("Failed to search restaurants");
            }
        }

        // ✅ reserve table
        function reserveRestaurant(id) {

            alert(
                "Restaurant Reservation Started for ID: "
                + id
            );
        }


        // ✅ first load
        loadRestaurants();

    </script>

</body>

</html>
