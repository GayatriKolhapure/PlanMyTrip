<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurants</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#111827;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        .restaurant-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:25px;
        }

        .restaurant-card{
            background:#1f2937;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }

        .restaurant-card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .restaurant-content{
            padding:20px;
        }

        .restaurant-content h2{
            margin-bottom:10px;
        }

        .restaurant-content p{
            margin-bottom:8px;
            color:#d1d5db;
        }

        .rating{
            color:gold;
        }

        .cost{
            color:#10b981;
            font-weight:bold;
        }

        .tags{
            margin-top:12px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .tag{
            background:#374151;
            padding:6px 10px;
            border-radius:20px;
            font-size:13px;
        }

        button{
            margin-top:15px;
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>Restaurants & Cafes</h1>

    <div
        class="restaurant-container"
        id="restaurantContainer"
    >

    </div>

<script>

const API_BASE = "http://localhost:8081";

const token = localStorage.getItem("token");

async function loadRestaurants(){

    try{

        const response = await fetch(
            `${API_BASE}/api/restaurants`,
            {
                headers:{
                    "Authorization":`Bearer ${token}`
                }
            }
        );

        if(response.status === 403){

            alert("Please login first");

            window.location.href = "login.html";

            return;
        }

        const restaurants = await response.json();

        displayRestaurants(restaurants);

    }
    catch(error){

        console.log(error);

        alert("Failed to load restaurants");
    }
}

function displayRestaurants(restaurants){

    const container =
        document.getElementById("restaurantContainer");

    container.innerHTML = "";

    restaurants.forEach(r => {

        container.innerHTML += `

            <div class="restaurant-card">

                <img src="${r.imageUrl}" alt="restaurant">

                <div class="restaurant-content">

                    <h2>${r.name}</h2>

                    <p>${r.description}</p>

                    <p><strong>Location:</strong> ${r.location}</p>

                    <p><strong>Cuisine:</strong> ${r.cuisine}</p>

                    <p><strong>Type:</strong> ${r.type}</p>

                    <p class="cost">
                        ₹${r.averageCostPerPerson} per person
                    </p>

                    <p class="rating">
                        ⭐ ${r.rating}
                    </p>

                    <div class="tags">

                        ${r.hasWifi ? '<span class="tag">WiFi</span>' : ''}

                        ${r.hasParking ? '<span class="tag">Parking</span>' : ''}

                        ${r.vegOnly ? '<span class="tag">Veg Only</span>' : ''}

                    </div>

                    <button onclick="reserveRestaurant(${r.id})">
                        Reserve Table
                    </button>

                </div>

            </div>

        `;
    });
}

function reserveRestaurant(id){

    alert("Restaurant Reservation Started for ID: " + id);
}

loadRestaurants();

</script>

</body>
</html>
